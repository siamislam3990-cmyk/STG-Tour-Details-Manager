<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STG Tour Manager | Professional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tour-card { transition: all 0.3s ease; }
        .stg-gradient-text { background: linear-gradient(90deg, #22c55e, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="pb-10">

    <!-- Header -->
    <header class="p-6 text-center border-b border-slate-800 mb-6 bg-slate-900/50">
        <h1 class="text-3xl font-extrabold stg-gradient-text">SAVAR TRAVELLERS GROUP</h1>
        <p class="text-gray-400 text-xs mt-1 tracking-widest uppercase">Tour Details Management System</p>
        
        <div class="mt-4 flex justify-center gap-2">
            <button id="admin-login-btn" onclick="toggleAdmin()" class="text-xs bg-slate-800 px-4 py-2 rounded-full border border-slate-700 hover:bg-slate-700">
                <i class="fas fa-lock-open mr-2"></i>Admin Login
            </button>
            <button id="admin-logout-btn" onclick="logout()" class="hidden text-xs bg-red-900/30 text-red-400 px-4 py-2 rounded-full border border-red-900/50">
                <i class="fas fa-sign-out-alt mr-2"></i>Logout
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4">

        <!-- Admin Dashboard (Hidden by default) -->
        <div id="admin-panel" class="hidden mb-10 space-y-4 animate-fadeIn">
            <div class="glass p-6 rounded-2xl shadow-2xl">
                <h2 class="text-xl font-bold text-green-400 mb-4 flex items-center">
                    <i class="fas fa-plus-circle mr-2"></i> Add New Tour
                </h2>
                <input type="hidden" id="edit-index">
                <input type="text" id="tour-name" placeholder="Tour Name (e.g. Sajek Valley)" 
                    class="w-full p-4 mb-4 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
                <textarea id="tour-details" rows="6" placeholder="Write full tour details here..." 
                    class="w-full p-4 mb-4 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-green-500 outline-none"></textarea>
                <button onclick="saveTour()" id="save-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all">
                    Publish Tour Details
                </button>
            </div>
        </div>

        <!-- Member View / Tour List -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">Active Tours</h2>
            <span id="tour-count" class="bg-slate-800 px-3 py-1 rounded-md text-sm text-gray-400">0 Tours</span>
        </div>

        <div id="tour-list" class="space-y-4">
            <!-- List will be here -->
        </div>

    </main>

    <!-- Success Toast -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-full shadow-2xl transition-all opacity-0 pointer-events-none">
        ✅ Copied to Clipboard!
    </div>

    <script>
        // Settings
        const ADMIN_PASSWORD = "stg123"; // CHANGE YOUR PASSWORD HERE
        let isAdmin = false;
        let tours = JSON.parse(localStorage.getItem('stg_tours_pro')) || [];

        // Logic
        function toggleAdmin() {
            const pass = prompt("Enter Admin Password:");
            if (pass === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('admin-login-btn').classList.add('hidden');
                document.getElementById('admin-logout-btn').classList.remove('hidden');
                renderTours();
            } else {
                alert("Wrong Password!");
            }
        }

        function logout() {
            isAdmin = false;
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('admin-login-btn').classList.remove('hidden');
            document.getElementById('admin-logout-btn').classList.add('hidden');
            renderTours();
        }

        function renderTours() {
            const list = document.getElementById('tour-list');
            document.getElementById('tour-count').innerText = `${tours.length} Tours`;
            list.innerHTML = '';
            
            tours.forEach((tour, index) => {
                list.innerHTML += `
                    <div class="tour-card glass rounded-2xl overflow-hidden border border-slate-800">
                        <div class="p-5">
                            <div class="flex justify-between items-start">
                                <div class="cursor-pointer flex-1" onclick="toggleAccordion(${index})">
                                    <h3 class="text-lg font-bold text-white flex items-center">
                                        <i class="fas fa-map-marker-alt text-red-500 mr-2 text-sm"></i>
                                        ${tour.name}
                                    </h3>
                                    <p id="preview-${index}" class="text-gray-400 text-sm mt-1 line-clamp-2">${tour.details}</p>
                                </div>
                                ${isAdmin ? `
                                    <div class="flex gap-2 ml-4">
                                        <button onclick="editTour(${index})" class="p-2 text-blue-400 hover:bg-blue-400/10 rounded-lg"><i class="fas fa-edit"></i></button>
                                        <button onclick="deleteTour(${index})" class="p-2 text-red-400 hover:bg-red-400/10 rounded-lg"><i class="fas fa-trash"></i></button>
                                    </div>
                                ` : ''}
                            </div>
                            
                            <div id="full-details-${index}" class="hidden mt-4 pt-4 border-t border-slate-700/50">
                                <pre class="whitespace-pre-wrap font-sans text-gray-300 text-sm leading-relaxed">${tour.details}</pre>
                            </div>

                            <div class="mt-5 flex gap-2">
                                <button onclick="copyTour('${encodeURIComponent(tour.details)}')" 
                                    class="flex-1 bg-slate-800 hover:bg-green-600 text-white py-3 rounded-xl text-sm font-semibold transition-all flex items-center justify-center gap-2">
                                    <i class="fas fa-copy"></i> Copy Details
                                </button>
                                <button onclick="toggleAccordion(${index})" id="btn-text-${index}"
                                    class="px-4 bg-slate-700/50 hover:bg-slate-700 text-gray-300 rounded-xl text-xs">
                                    More
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleAccordion(index) {
            const el = document.getElementById(`full-details-${index}`);
            const preview = document.getElementById(`preview-${index}`);
            const btn = document.getElementById(`btn-text-${index}`);
            
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                preview.classList.remove('line-clamp-2');
                btn.innerText = "Less";
            } else {
                el.classList.add('hidden');
                preview.classList.add('line-clamp-2');
                btn.innerText = "More";
            }
        }

        function saveTour() {
            const name = document.getElementById('tour-name').value;
            const details = document.getElementById('tour-details').value;
            const editIndex = document.getElementById('edit-index').value;

            if (!name || !details) return alert("Fill all fields!");

            if (editIndex === "") {
                tours.unshift({ name, details });
            } else {
                tours[editIndex] = { name, details };
                document.getElementById('edit-index').value = "";
                document.getElementById('save-btn').innerText = "Publish Tour Details";
            }

            localStorage.setItem('stg_tours_pro', JSON.stringify(tours));
            document.getElementById('tour-name').value = '';
            document.getElementById('tour-details').value = '';
            renderTours();
        }

        function editTour(index) {
            document.getElementById('tour-name').value = tours[index].name;
            document.getElementById('tour-details').value = tours[index].details;
            document.getElementById('edit-index').value = index;
            document.getElementById('save-btn').innerText = "Update Tour";
            window.scrollTo({ top: 150, behavior: 'smooth' });
        }

        function deleteTour(index) {
            if (confirm("Delete this tour?")) {
                tours.splice(index, 1);
                localStorage.setItem('stg_tours_pro', JSON.stringify(tours));
                renderTours();
            }
        }

        // Improved Copy Function for Mobile
        async function copyTour(encodedStr) {
            const text = decodeURIComponent(encodedStr);
            try {
                await navigator.clipboard.writeText(text);
                showToast();
            } catch (err) {
                // Fallback for older browsers/HTTP
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast();
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        renderTours();
    </script>
</body>
</html>

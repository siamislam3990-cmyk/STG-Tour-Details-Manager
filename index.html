<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STG Tour Details Manager</title>
    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f2f2f7; color: #1c1c1e; font-family: 'Hind Siliguri', sans-serif; }
        .ios-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 10px 25px rgba(0,0,0,0.03); }
        .stg-gradient { background: linear-gradient(135deg, #059669 0%, #dc2626 100%); }
        .line-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* এই অংশটি নতুন যোগ করা হয়েছে লাইন ব্রেক ঠিক করার জন্য */
        .whitespace-pre-wrap { white-space: pre-wrap; word-wrap: break-word; }
        
        .shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body class="pb-10">

    <!-- Header UI -->
    <div class="stg-gradient h-48 w-full rounded-b-[40px] absolute top-0 z-0 shadow-lg"></div>
    
    <header class="relative z-10 px-6 pt-10 pb-6 text-white text-center">
        <h1 class="text-3xl font-extrabold tracking-tight">Savar Travellers Group</h1>
        <p class="text-white/80 text-sm mt-1">Professional Tour Details Manager</p>
        
        <div class="mt-4 inline-block bg-white/20 backdrop-blur-md px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest border border-white/30">
            Real-time Sync Active
        </div>
    </header>

    <main class="relative z-10 px-5 space-y-6">
        
        <!-- Admin Entry -->
        <div class="flex justify-end pr-2">
            <button onclick="checkAdmin()" class="w-10 h-10 bg-white shadow-lg rounded-full flex items-center justify-center text-gray-700 hover:text-green-600">
                <i class="fa-solid fa-user-shield"></i>
            </button>
        </div>

        <!-- Admin Input Panel -->
        <div id="admin-panel" class="hidden ios-card p-6 border-2 border-green-500/20">
            <div class="flex justify-between items-center mb-4">
                <h3 id="panel-title" class="font-bold text-lg text-green-700 underline">Add New Tour Details</h3>
                <button onclick="logout()" class="text-xs text-red-500 font-bold uppercase">Logout</button>
            </div>
            
            <input type="hidden" id="edit-key">
            
            <input type="text" id="t-name" placeholder="ট্যুর এর নাম..." class="w-full p-4 mb-3 bg-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-green-500">
            <textarea id="t-desc" rows="5" placeholder="বিস্তারিত তথ্য বা বাংলা ক্যাপশন পেস্ট করুন..." class="w-full p-4 mb-4 bg-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-green-500"></textarea>
            
            <div class="flex gap-2">
                <button onclick="saveToCloud()" id="save-btn" class="w-full bg-green-600 text-white font-bold py-4 rounded-2xl shadow-xl active:scale-95 transition-all">Publish Globally</button>
                <button onclick="resetForm()" id="cancel-btn" class="hidden w-1/3 bg-gray-400 text-white font-bold py-4 rounded-2xl shadow-xl active:scale-95 transition-all">Cancel</button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" onkeyup="searchTours(this.value)" placeholder="ট্যুর খুঁজুন..." class="w-full py-4 pl-12 pr-4 bg-white rounded-2xl shadow-sm outline-none focus:ring-2 focus:ring-green-500 transition-all">
        </div>

        <!-- Tour List Container -->
        <div id="tour-container" class="space-y-5">
            <div class="shimmer h-32 w-full rounded-3xl"></div>
            <div class="shimmer h-32 w-full rounded-3xl"></div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="copy-toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur text-white px-8 py-4 rounded-3xl shadow-2xl transition-all opacity-0 pointer-events-none z-[100] border border-white/10">
        <span class="flex items-center gap-3 font-bold">
            <i class="fa-solid fa-circle-check text-green-400 text-xl"></i> টেক্সট কপি হয়েছে!
        </span>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://stg-tour-details-manager-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('tours');

        let isAdmin = false;
        let allTours = [];

        function checkAdmin() {
            const pass = prompt("Enter Admin Password:");
            if (pass === "stg123") {
                isAdmin = true;
                document.getElementById('admin-panel').classList.remove('hidden');
                render();
            }
        }

        function logout() { 
            isAdmin = false; 
            document.getElementById('admin-panel').classList.add('hidden'); 
            resetForm();
            render(); 
        }

        function saveToCloud() {
            const name = document.getElementById('t-name').value;
            const details = document.getElementById('t-desc').value;
            const editKey = document.getElementById('edit-key').value;

            if(!name || !details) return alert("সবগুলো ঘর পূরণ করুন");

            if(editKey) {
                db.child(editKey).update({
                    name: name,
                    details: details,
                    lastUpdated: Date.now()
                }).then(() => resetForm());
            } else {
                const newPostRef = db.push();
                newPostRef.set({ name, details, time: Date.now() });
                resetForm();
            }
        }

        function editTour(key, name, encodedDetails) {
            const details = decodeURIComponent(encodedDetails);
            document.getElementById('t-name').value = name;
            document.getElementById('t-desc').value = details;
            document.getElementById('edit-key').value = key;
            
            document.getElementById('panel-title').innerText = "Edit Tour Details";
            document.getElementById('save-btn').innerText = "Update Now";
            document.getElementById('save-btn').classList.replace('bg-green-600', 'bg-blue-600');
            document.getElementById('cancel-btn').classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('t-name').value = '';
            document.getElementById('t-desc').value = '';
            document.getElementById('edit-key').value = '';
            document.getElementById('panel-title').innerText = "Add New Tour Details";
            document.getElementById('save-btn').innerText = "Publish Globally";
            document.getElementById('save-btn').classList.replace('bg-blue-600', 'bg-green-600');
            document.getElementById('cancel-btn').classList.add('hidden');
        }

        function deleteTour(key) {
            if(confirm("Are you sure you want to delete this?")) db.child(key).remove();
        }

        db.on('value', (snapshot) => {
            const data = snapshot.val();
            allTours = data ? Object.entries(data).reverse() : [];
            render();
        });

        function render(dataList = allTours) {
            const container = document.getElementById('tour-container');
            container.innerHTML = dataList.length === 0 ? '<div class="text-center py-10 text-gray-400">কোনো ডেটা পাওয়া যায়নি</div>' : '';
            
            dataList.forEach(([key, item]) => {
                const encodedDetails = encodeURIComponent(item.details);
                container.innerHTML += `
                    <div class="ios-card overflow-hidden group border-l-4 border-green-500">
                        <div class="p-6">
                            <div class="flex justify-between items-start mb-3">
                                <h3 class="text-xl font-bold text-gray-900 flex-1 leading-tight">${item.name}</h3>
                                ${isAdmin ? `
                                    <div class="flex gap-2">
                                        <button onclick="editTour('${key}', '${item.name}', \`${encodedDetails}\`)" class="text-blue-500 p-2 hover:bg-blue-50 rounded-full transition-colors">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </button>
                                        <button onclick="deleteTour('${key}')" class="text-red-400 p-2 hover:bg-red-50 rounded-full transition-colors">
                                            <i class="fa-solid fa-trash-can"></i>
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                            <!-- নিচে whitespace-pre-wrap ক্লাসটি যোগ করা হয়েছে লাইন স্পেসিং ঠিক রাখার জন্য -->
                            <p class="text-gray-600 text-[15px] leading-relaxed line-clamp mb-5 whitespace-pre-wrap" id="desc-${key}">${item.details}</p>
                            
                            <div class="flex gap-3">
                                <button onclick="copyText(\`${encodedDetails}\`)" class="flex-[2] stg-gradient text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all">
                                    <i class="fa-solid fa-copy"></i> কপি করুন
                                </button>
                                <button onclick="toggleText('${key}')" id="btn-${key}" class="flex-1 bg-gray-100 text-gray-600 font-bold py-4 rounded-2xl text-xs uppercase tracking-wider">
                                    বিস্তারিত
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleText(key) {
            const el = document.getElementById(`desc-${key}`);
            const btn = document.getElementById(`btn-${key}`);
            el.classList.toggle('line-clamp');
            btn.innerText = el.classList.contains('line-clamp') ? 'বিস্তারিত' : 'সংক্ষিপ্ত';
        }

        async function copyText(encoded) {
            const text = decodeURIComponent(encoded);
            try {
                await navigator.clipboard.writeText(text);
                showToast();
            } catch (err) {
                const input = document.createElement("textarea");
                input.value = text;
                document.body.appendChild(input);
                input.select();
                document.execCommand("copy");
                document.body.removeChild(input);
                showToast();
            }
        }

        function showToast() {
            const t = document.getElementById('copy-toast');
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }

        function searchTours(val) {
            const filtered = allTours.filter(([key, item]) => item.name.toLowerCase().includes(val.toLowerCase()));
            render(filtered);
        }
    </script>
</body>
</html>
